<!doctype html>
<html lang="ar" dir="rtl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisan Design Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F4; --surface:#FFFFFF; --surface-2:#F0F1EC; --line:#E3E4DE;
  --text:#14181F; --muted:#5B6270; --faint:#8A909B;
  --brand:#0E7C6B; --brand-ink:#FFFFFF; --brand-soft:#DDF1EC;
  --accent:#E8A33D; --accent-soft:#FBEFD9;
  --danger:#C2453D; --ok:#2E8B57;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,24,31,.04),0 8px 24px rgba(20,24,31,.06);
  --font:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1216; --surface:#161A20; --surface-2:#1C2129; --line:#262C35;
    --text:#ECEEF1; --muted:#A3AAB5; --faint:#717986;
    --brand:#3CC2A8; --brand-ink:#06201B; --brand-soft:#123A33;
    --accent:#F0B65A; --accent-soft:#3A2D16;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#161A20; --surface-2:#1C2129; --line:#262C35;
  --text:#ECEEF1; --muted:#A3AAB5; --faint:#717986;
  --brand:#3CC2A8; --brand-ink:#06201B; --brand-soft:#123A33;
  --accent:#F0B65A; --accent-soft:#3A2D16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:inherit}
button{font:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:999px;font-weight:500}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);height:38px;min-width:38px;padding:0 10px;border-radius:999px;display:inline-grid;place-items:center;font-weight:600;font-size:.85rem}
@media (max-width:640px){.nav{display:none}.mobile-nav{display:flex!important}}
.mobile-nav{display:none;position:fixed;bottom:0;inset-inline:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
.mobile-nav .tab{flex:1;font-size:.85rem}

.screen{display:none;animation:fade .35s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.demo-banner{margin:16px 0 0;padding:10px 14px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--text);font-size:.9rem;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,background .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* landing */
.hero{padding:56px 0 32px;display:grid;gap:40px;grid-template-columns:1.1fr .9fr;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-top:32px}}
.eyebrow{display:inline-block;background:var(--brand-soft);color:var(--brand);padding:4px 12px;border-radius:999px;font-size:.85rem;font-weight:600}
h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.2;margin:16px 0;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:1.1rem;max-width:34em}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.chat-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px}
.chat-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--accent));flex:none}
.bubble{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:88%;font-size:.95rem}
.bubble.ai{background:var(--surface-2)}
.bubble.me{background:var(--brand);color:var(--brand-ink);margin-inline-start:auto}
.fix{font-size:.85rem;border-inline-start:3px solid var(--accent);padding:6px 10px;background:var(--accent-soft);border-radius:8px;margin:6px 0}
.fix s{color:var(--danger)} .fix b{color:var(--ok)}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:start}
.section{padding:40px 0}
.section h2{font-size:1.6rem;margin:0 0 8px}
.section .sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card h3{margin:12px 0 6px;font-size:1.05rem}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.ic{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.ic svg{width:22px;height:22px}
.langs{display:flex;flex-wrap:wrap;gap:10px}
.lang-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px}
[dir="rtl"] .lang-chip{padding:6px 6px 6px 14px}
.glyph{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.plans{display:grid;gap:16px;grid-template-columns:repeat(3,1fr)}
@media (max-width:860px){.plans{grid-template-columns:1fr}}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.plan.featured{border:2px solid var(--brand)}
.plan ul{padding-inline-start:18px;color:var(--muted);margin:12px 0 0}
.price-tbd{font-size:.85rem;color:var(--faint)}

/* onboarding */
.ob{max-width:640px;margin:32px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
@media (max-width:640px){.ob{padding:20px;margin-top:16px}}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:24px}
.progress i{display:block;height:100%;background:var(--brand);transition:width .35s ease}
.step-label{color:var(--faint);font-size:.85rem}
.ob h2{margin:4px 0 20px;font-size:1.4rem}
.options{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:14px;text-align:start;display:flex;gap:10px;align-items:center;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--faint)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt small{display:block;color:var(--muted);font-size:.8rem}
.ob-foot{display:flex;justify-content:space-between;margin-top:24px;gap:12px}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-weight:600}

/* dashboard */
.dash{display:grid;gap:16px;grid-template-columns:repeat(12,1fr);padding:16px 0 96px}
.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-12{grid-column:span 12}
@media (max-width:860px){.span-8,.span-4,.span-6{grid-column:span 12}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.panel h3{margin:0 0 14px;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.kpi .v{font-size:1.6rem;font-weight:700}
.kpi .l{color:var(--muted);font-size:.85rem}
.skill{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;margin:10px 0;font-size:.9rem}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.weak{background:var(--accent)}
.cefr{font-weight:700;font-size:.8rem;text-align:center;background:var(--surface-2);border-radius:6px;padding:2px 0}
.plan-item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--surface-2);margin:8px 0}
.plan-item .why{color:var(--muted);font-size:.82rem}
.plan-item .min{margin-inline-start:auto;color:var(--faint);font-size:.85rem;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:500}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.err{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.err:last-child{border:0}
.chart svg{width:100%;height:160px;display:block}
footer{color:var(--faint);font-size:.85rem;padding:32px 0 96px;border-top:1px solid var(--line);margin-top:32px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="logo"><span class="logo-mark">ل</span><span data-i18n="brand"></span></div>
    <nav class="nav" role="tablist">
      <button class="tab" role="tab" data-go="landing" aria-selected="true" data-i18n="nav_home"></button>
      <button class="tab" role="tab" data-go="onboarding" data-i18n="nav_onboarding"></button>
      <button class="tab" role="tab" data-go="dashboard" data-i18n="nav_dashboard"></button>
    </nav>
    <button class="icon-btn" id="langBtn" aria-label="Language">EN</button>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
  </div>
</header>

<nav class="mobile-nav" role="tablist">
  <button class="tab" role="tab" data-go="landing" aria-selected="true" data-i18n="nav_home"></button>
  <button class="tab" role="tab" data-go="onboarding" data-i18n="nav_onboarding"></button>
  <button class="tab" role="tab" data-go="dashboard" data-i18n="nav_dashboard"></button>
</nav>

<main class="wrap">

<!-- LANDING -->
<section class="screen active" id="landing">
  <div class="demo-banner" data-i18n="proto_note"></div>
  <div class="hero">
    <div>
      <span class="eyebrow" data-i18n="eyebrow"></span>
      <h1 data-i18n="hero_title"></h1>
      <p class="lead" data-i18n="hero_lead"></p>
      <div class="cta">
        <button class="btn btn-primary" data-go="onboarding" data-i18n="cta_start"></button>
        <button class="btn btn-ghost" data-go="dashboard" data-i18n="cta_see"></button>
      </div>
    </div>
    <div class="chat-card" aria-label="Tutor preview">
      <div class="chat-head"><span class="avatar"></span><div><b data-i18n="tutor_name"></b><div class="status" data-i18n="tutor_status"></div></div></div>
      <div class="bubble ai ltr">Wie war dein Wochenende? Was hast du gemacht?</div>
      <div class="bubble me ltr">Ich habe am Samstag ins Kino gegangen.</div>
      <div class="fix"><span class="ltr"><s>habe … gegangen</s> → <b>bin … gegangen</b></span><div data-i18n="fix_explain"></div></div>
      <div class="bubble ai ltr">Super! Welchen Film hast du gesehen?</div>
    </div>
  </div>

  <div class="section">
    <h2 data-i18n="feat_title"></h2>
    <p class="sub" data-i18n="feat_sub"></p>
    <div class="grid" id="features"></div>
  </div>

  <div class="section">
    <h2 data-i18n="langs_title"></h2>
    <p class="sub" data-i18n="langs_sub"></p>
    <div class="langs" id="langChips"></div>
  </div>

  <div class="section">
    <h2 data-i18n="plans_title"></h2>
    <p class="sub" data-i18n="plans_sub"></p>
    <div class="plans" id="plans"></div>
  </div>
  <footer data-i18n="footer"></footer>
</section>

<!-- ONBOARDING -->
<section class="screen" id="onboarding">
  <div class="ob">
    <div class="progress"><i id="prog"></i></div>
    <div class="step-label" id="stepLabel"></div>
    <h2 id="stepTitle"></h2>
    <div id="stepBody"></div>
    <div class="ob-foot">
      <button class="btn btn-ghost" id="backBtn" data-i18n="back"></button>
      <button class="btn btn-primary" id="nextBtn" data-i18n="next"></button>
    </div>
  </div>
</section>

<!-- DASHBOARD -->
<section class="screen" id="dashboard">
  <div class="demo-banner" data-i18n="demo_data"></div>
  <div class="dash">
    <div class="span-12 kpis" id="kpis"></div>
    <div class="panel span-8">
      <h3><span data-i18n="today_plan"></span><span class="status" data-i18n="adaptive"></span></h3>
      <div id="todayPlan"></div>
    </div>
    <div class="panel span-4">
      <h3 data-i18n="skills"></h3>
      <div id="skills"></div>
    </div>
    <div class="panel span-6 chart">
      <h3 data-i18n="weekly"></h3>
      <svg id="chart" viewBox="0 0 320 160" role="img" aria-label="Weekly minutes"></svg>
    </div>
    <div class="panel span-6">
      <h3 data-i18n="errors"></h3>
      <div id="errors"></div>
    </div>
    <div class="panel span-12">
      <h3 data-i18n="services"></h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="services"></div>
    </div>
  </div>
</section>

</main>

let lang="ar";
const t=k=>T[lang][k];
const state={step:0,native:null,target:null,goal:null,time:null,level:null};
const STEPS=["native","target","goal","time","level","done"];

function renderStatic(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.getElementById("langBtn").textContent=lang==="ar"?"EN":"ع";
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.getElementById("features").innerHTML=["tutor","mic","test","cards","play","pen","chart","people"].map(k=>
    `<div class="card"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg></div><h3>${t("f_"+k)}</h3><p>${t("f_"+k+"_d")}</p></div>`).join("");
  document.getElementById("langChips").innerHTML=LANGS.map(l=>
    `<span class="lang-chip"><span class="glyph">${l.g}</span>${l[lang]} <small style="color:var(--faint)">${l.n}</small></span>`).join("");
  document.getElementById("plans").innerHTML=[["p_free","p_free_l",""],["p_prem","p_prem_l","featured"],["p_pro","p_pro_l",""]].map(([n,l,f])=>
    `<div class="plan ${f}"><h3 style="margin:0">${t(n)}</h3><div class="price-tbd">${n==="p_free"?"$0":t("price_tbd")}</div><ul>${t(l).map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("");
  renderDash(); renderStep();
}

function opt(key,val,label,sub,glyph){
  const on=state[key]===val;
  return `<button class="opt" aria-pressed="${on}" data-k="${key}" data-v="${val}">${glyph?`<span class="glyph">${glyph}</span>`:""}<span>${label}${sub?`<small>${sub}</small>`:""}</span></button>`;
}
function renderStep(){
  const s=STEPS[state.step], n=STEPS.length-1;
  document.getElementById("prog").style.width=((state.step)/n*100)+"%";
  document.getElementById("stepLabel").textContent=s==="done"?"":t("step").replace("{a}",state.step+1).replace("{b}",n);
  document.getElementById("stepTitle").textContent=t("s_"+s);
  let body="";
  if(s==="native"||s==="target"){
    body=`<div class="options">${LANGS.filter(l=>s!=="target"||l.c!==state.native).map(l=>opt(s,l.c,l[lang],l.n,l.g)).join("")}</div>`;
  }else if(s==="goal"){
    body=`<div class="options">${t("goals").map(([v,l])=>opt("goal",v,l)).join("")}</div>`;
  }else if(s==="time"){
    body=`<div class="options">${t("times").map(([v,l,sub])=>opt("time",v,l,sub)).join("")}</div>`;
  }else if(s==="level"){
    body=`<div class="options">${t("levels").map(([v,l])=>opt("level",v,v,l)).join("")}</div>`;
  }else{
    const L=c=>{const x=LANGS.find(l=>l.c===c);return x?x[lang]:"—"};
    const G=t("goals").find(g=>g[0]===state.goal), TM=t("times").find(x=>x[0]===state.time);
    body=`<div class="summary"><dl>
      <dt>${t("sum_native")}</dt><dd>${L(state.native)}</dd>
      <dt>${t("sum_target")}</dt><dd>${L(state.target)}</dd>
      <dt>${t("sum_goal")}</dt><dd>${G?G[1]:"—"}</dd>
      <dt>${t("sum_time")}</dt><dd>${TM?TM[1]:"—"}</dd>
      <dt>${t("sum_level")}</dt><dd>${state.level||"—"}</dd></dl>
      <p class="demo-banner">${t("sum_next")}</p></div>`;
  }
  document.getElementById("stepBody").innerHTML=body;
  const back=document.getElementById("backBtn"), next=document.getElementById("nextBtn");
  back.style.visibility=state.step===0?"hidden":"visible";
  next.textContent=s==="done"?t("finish"):t("next");
  next.disabled=s!=="done"&&!state[s];
}
document.getElementById("stepBody").addEventListener("click",e=>{
  const b=e.target.closest(".opt"); if(!b) return;
  state[b.dataset.k]=b.dataset.v;
  if(b.dataset.k==="native"&&state.target===state.native) state.target=null;
  renderStep();
});
document.getElementById("nextBtn").onclick=()=>{
  if(STEPS[state.step]==="done"){go("dashboard");return}
  state.step++;renderStep();
};
document.getElementById("backBtn").onclick=()=>{if(state.step>0){state.step--;renderStep()}};

function renderDash(){
  const k=[["A2","k_level"],["412","k_words"],["9","k_streak"],["118","k_time"]];
  document.getElementById("kpis").innerHTML=k.map(([v,l])=>`<div class="kpi"><div class="v ltr">${v}</div><div class="l">${t(l)}</div></div>`).join("");
  document.getElementById("todayPlan").innerHTML=t("plan_items").map(([a,b,c])=>
    `<div class="plan-item"><div><div>${a}</div><div class="why">${b}</div></div><span class="min">${c}</span></div>`).join("");
  const lv=[["B1",62],["A2",48],["B1",66],["A2",52],["A2",40],["A2",30],["A2",35]];
  document.getElementById("skills").innerHTML=t("sk").map((s,i)=>
    `<div class="skill"><span>${s}</span><div class="bar"><i class="${lv[i][1]<40?"weak":""}" style="width:${lv[i][1]}%"></i></div><span class="cefr">${lv[i][0]}</span></div>`).join("");
  document.getElementById("errors").innerHTML=t("errs").map(([a,b])=>`<div class="err"><span>${a}</span><b>${b}</b></div>`).join("");
  document.getElementById("services").innerHTML=t("svc").map(s=>`<span class="status">${s}</span>`).join("");
  const mins=[12,18,0,22,15,26,25], max=30, w=320, h=160, bw=28, gap=(w-7*bw)/8;
  const order=lang==="ar"?[...mins.keys()].reverse():[...mins.keys()];
  document.getElementById("chart").innerHTML=order.map((i,pos)=>{
    const x=gap+pos*(bw+gap), bh=(mins[i]/max)*(h-34), y=h-20-bh;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(bh,2)}" rx="6" fill="var(--brand)" opacity="${mins[i]?1:.25}"><title>${mins[i]}</title></rect>
            <text x="${x+bw/2}" y="${h-4}" text-anchor="middle" font-size="11" fill="var(--muted)">${t("days")[i]}</text>`;
  }).join("");
}

function go(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id));
  document.querySelectorAll("[data-go].tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.go===id));
  window.scrollTo({top:0,behavior:"smooth"});
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]"); if(b) go(b.dataset.go)});
document.getElementById("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";renderStatic()};
document.getElementById("themeBtn").onclick=()=>{
  const r=document.documentElement, dark=r.dataset.theme==="dark"||(r.dataset.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  r.dataset.theme=dark?"light":"dark";
};
renderStatic();
</script>
