name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lisan
          POSTGRES_PASSWORD: lisan
          POSTGRES_DB: lisan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lisan" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://lisan:lisan@localhost:5432/lisan
      TEST_DATABASE_URL: postgres://lisan:lisan@localhost:5432/lisan_test
      # E2E tests exercise the admin review flow, so factory lessons start as drafts here.
      FACTORY_STATUS: draft
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-123456
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=lisan psql -h localhost -U lisan -d lisan -c "CREATE DATABASE lisan_test"
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
