name: Landmark images (Wikimedia Commons)

# Downloads one freely licensed landmark photo per language into
# public/images/landmarks with attribution (credits.json).
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/factory/fetch_landmarks.py"
      - ".github/workflows/landmark-images.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fetch photos
        run: python3 -I scripts/factory/fetch_landmarks.py public/images/landmarks
      - name: Commit
        run: |
          ls -la public/images/landmarks
          git config user.name "lisan-image-fetcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/landmarks
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Landmark photos from Wikimedia Commons (free licences, credited)"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0; sleep 5; done
          exit 1
