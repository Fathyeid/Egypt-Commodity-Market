name: Devcontainer smoke test

# Builds the Codespaces dev container exactly as Codespaces does (devcontainer CLI),
# runs its lifecycle hooks, then checks the app answers on port 3000.
on:
  workflow_dispatch:
  push:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"

jobs:
  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ar || true)
              echo "attempt $i: HTTP $code"
              [ "$code" = "200" ] && break
              sleep 5
            done
            echo "----- /tmp/lisan.log -----"
            tail -n 60 /tmp/lisan.log || echo "(no log file)"
            echo "----- processes -----"
            ps aux | grep -E "next|node" | grep -v grep || true
            echo "----- .env keys -----"
            sed 's/=.*/=…/' .env || true
            test "$code" = "200"
