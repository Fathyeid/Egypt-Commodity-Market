services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lisan
      POSTGRES_PASSWORD: lisan
      POSTGRES_DB: lisan
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
